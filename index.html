<!DOCTYPE html>
<html lang="ms">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistem KPI UKJ &amp; Lajnah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
  :root {
    --navy: #1B2B4B;
    --navy-2: #24395F;
    --navy-3: #2F4A78;
    --oren: #F5A524;
    --oren-2: #E08E0B;
    --latar: #EEF1F5;
    --kad: #FFFFFF;
    --teks: #1B2B4B;
    --teks-2: #5B6B85;
    --garis: #DCE2EB;
    --hijau: #2E9E5B;
    --kuning: #E0A800;
    --merah: #D64545;
    --bayang: 0 6px 18px rgba(27, 43, 75, .08);
    --jejari: 6px;
    --sidebar: 248px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--latar); color: var(--teks); font-size: 14px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--navy-3); }
  [hidden] { display: none !important; }

  /* ---------- Cangkerang ---------- */
  .aplikasi { display: flex; min-height: 100vh; }
  .sidebar {
    width: var(--sidebar); flex: 0 0 var(--sidebar); background: var(--navy); color: #fff;
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; z-index: 30;
  }
  .jenama-sidebar { display: flex; align-items: center; gap: 12px; padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .logo-sidebar { width: 48px; height: 48px; flex: 0 0 48px; padding: 3px; background: #fff; border-radius: 50%; }
  .jenama-teks b { display: block; font-size: 16px; font-weight: 800; line-height: 1.15; }
  .jenama-teks span { display: block; font-size: 11px; color: var(--oren); font-weight: 600; letter-spacing: .04em; margin-top: 2px; }
  .profil { padding: 22px 20px 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,.08); cursor: pointer; }
  .avatar {
    width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 12px; background: #fff; color: var(--navy);
    display: grid; place-items: center; font-weight: 800; font-size: 26px; box-shadow: 0 0 0 5px rgba(255,255,255,.12);
  }
  .profil-nama { font-weight: 700; font-size: 15px; letter-spacing: .02em; }
  .profil-jawatan { font-size: 12px; opacity: .75; margin-top: 2px; }
  .profil-entiti { display: inline-block; margin-top: 8px; font-size: 11px; font-weight: 700; background: var(--oren); color: var(--navy); padding: 2px 8px; border-radius: 99px; }
  .menu { list-style: none; margin: 0; padding: 14px 10px; flex: 1; overflow-y: auto; }
  .menu button {
    width: 100%; display: flex; align-items: center; gap: 14px; padding: 11px 14px; border: 0; background: none;
    color: rgba(255,255,255,.82); border-radius: var(--jejari); cursor: pointer; text-align: left; font-size: 14px;
  }
  .menu button:hover { background: rgba(255,255,255,.06); color: #fff; }
  .menu button.aktif { background: var(--navy-2); color: #fff; box-shadow: inset 3px 0 0 var(--oren); }
  .menu svg { width: 18px; height: 18px; flex: 0 0 18px; }
  .sidebar-kaki { padding: 14px 20px 20px; font-size: 11px; opacity: .55; }

  .utama { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .bar-atas {
    display: flex; align-items: center; gap: 12px; padding: 22px 28px 10px;
  }
  .bar-atas h1 { font-size: 20px; margin: 0; font-weight: 700; flex: 1; }
  .butang-menu { display: none; border: 0; background: none; padding: 6px; cursor: pointer; }
  .butang-menu svg { width: 24px; height: 24px; }
  .kandungan { padding: 8px 28px 40px; }
  .latar-laci { display: none; }

  /* ---------- Komponen ---------- */
  .kad { background: var(--kad); border-radius: var(--jejari); box-shadow: var(--bayang); padding: 18px 20px; }
  .kad h3 { margin: 0 0 12px; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .kad h3 .ruang { flex: 1; }
  .butang {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; cursor: pointer;
    padding: 9px 16px; border-radius: 6px; font-weight: 600; font-size: 13px; background: var(--navy); color: #fff;
  }
  .butang:hover { background: var(--navy-2); }
  .butang.oren { background: var(--oren); color: var(--navy); }
  .butang.oren:hover { background: var(--oren-2); }
  .butang.garis { background: transparent; color: var(--navy); box-shadow: inset 0 0 0 1.5px var(--garis); }
  .butang.garis:hover { box-shadow: inset 0 0 0 1.5px var(--navy-3); }
  .butang.bahaya { background: var(--merah); }
  .butang.kecil { padding: 5px 10px; font-size: 12px; }
  .butang.besar { padding: 13px 22px; font-size: 15px; width: 100%; }
  .butang[disabled] { opacity: .55; cursor: wait; }

  .lencana { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .lencana::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .lencana.HIJAU { color: var(--hijau); background: rgba(46,158,91,.12); }
  .lencana.KUNING { color: #A77C00; background: rgba(224,168,0,.15); }
  .lencana.MERAH { color: var(--merah); background: rgba(214,69,69,.12); }
  .lencana.KOSONG { color: var(--teks-2); background: #EEF1F5; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 4px; background: #EEF1F5; color: var(--teks-2); }
  .tag.oren { background: rgba(245,165,36,.18); color: #9A5F00; }
  .tag.navy { background: var(--navy); color: #fff; }

  .medan { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .medan label { font-size: 12px; font-weight: 600; color: var(--teks-2); }
  .medan input, .medan select, .medan textarea {
    border: 1.5px solid var(--garis); border-radius: 6px; padding: 10px 12px; background: #fff; width: 100%;
  }
  .medan input:focus, .medan select:focus, .medan textarea:focus { outline: none; border-color: var(--navy-3); }
  .medan .bantu { font-size: 11px; color: var(--teks-2); }
  .baris-medan { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0 14px; }
  .suis { display: flex; background: #EEF1F5; border-radius: 8px; padding: 4px; gap: 4px; margin-bottom: 16px; }
  .suis button { flex: 1; border: 0; padding: 9px; border-radius: 6px; background: none; cursor: pointer; font-weight: 600; color: var(--teks-2); }
  .suis button.aktif { background: #fff; color: var(--navy); box-shadow: 0 1px 3px rgba(0,0,0,.1); }

  .penapis { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .penapis select { border: 0; background: #fff; box-shadow: var(--bayang); border-radius: 6px; padding: 8px 10px; font-size: 13px; max-width: 220px; }

  .senarai { list-style: none; margin: 0; padding: 0; }
  .senarai li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #EEF1F5; }
  .senarai li:last-child { border-bottom: 0; }
  .senarai .isi { flex: 1; min-width: 0; }
  .senarai .tajuk { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .senarai .kecil { font-size: 12px; color: var(--teks-2); }
  .kosong { text-align: center; color: var(--teks-2); padding: 28px 10px; }

  .jadual-bungkus { overflow-x: auto; }
  table.jadual { width: 100%; border-collapse: collapse; font-size: 13px; }
  .jadual th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--teks-2); padding: 8px 10px; border-bottom: 1.5px solid var(--garis); white-space: nowrap; }
  .jadual td { padding: 10px; border-bottom: 1px solid #EEF1F5; vertical-align: top; }
  .jadual tr:hover td { background: #FAFBFD; }
  .aksi-sel { display: flex; flex-wrap: wrap; gap: 4px; min-width: 110px; }

  .tab { display: flex; gap: 4px; border-bottom: 1.5px solid var(--garis); margin-bottom: 16px; overflow-x: auto; }
  .tab button { border: 0; background: none; padding: 10px 14px; cursor: pointer; font-weight: 600; color: var(--teks-2); border-bottom: 2.5px solid transparent; margin-bottom: -1.5px; white-space: nowrap; }
  .tab button.aktif { color: var(--navy); border-bottom-color: var(--oren); }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 12px 18px; border-radius: 8px; box-shadow: var(--bayang); z-index: 100; max-width: calc(100% - 32px); }
  .toast.ralat { background: var(--merah); }
  dialog.modal { border: 0; border-radius: 10px; padding: 0; width: min(620px, calc(100% - 24px)); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  dialog.modal::backdrop { background: rgba(27,43,75,.45); }
  .modal-kepala { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--garis); }
  .modal-kepala h2 { margin: 0; font-size: 16px; flex: 1; }
  .modal-kepala button { border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--teks-2); }
  .modal-badan { padding: 18px 20px; max-height: 70vh; overflow-y: auto; }
  .modal-kaki { padding: 14px 20px; border-top: 1px solid var(--garis); display: flex; gap: 8px; justify-content: flex-end; }
  .memuat { display: grid; place-items: center; padding: 60px; color: var(--teks-2); }
  .putar { width: 28px; height: 28px; border: 3px solid var(--garis); border-top-color: var(--oren); border-radius: 50%; animation: putar .8s linear infinite; }
  @keyframes putar { to { transform: rotate(360deg); } }

  /* ---------- Dashboard ---------- */
  .grid-kad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-bottom: 18px; }
  .kad-angka { position: relative; min-height: 116px; display: flex; flex-direction: column; justify-content: space-between; }
  .kad-angka .label { font-size: 13px; font-weight: 600; color: var(--teks-2); display: flex; justify-content: space-between; align-items: center; }
  .kad-angka .label svg { width: 18px; height: 18px; color: var(--oren); }
  .kad-angka .nilai { font-size: 34px; font-weight: 600; letter-spacing: -.01em; margin-top: 10px; }
  .kad-angka .sub { font-size: 12px; color: var(--teks-2); margin-top: 2px; }
  .kad-angka.utama-navy { background: var(--navy); color: #fff; }
  .kad-angka.utama-navy .label, .kad-angka.utama-navy .sub { color: rgba(255,255,255,.75); }
  .kad-angka.utama-navy .label .ikon-bulat { width: 22px; height: 22px; border-radius: 50%; background: #fff; color: var(--navy); display: grid; place-items: center; }
  .grid-dash {
    display: grid; grid-template-columns: repeat(3, minmax(0,1fr)) minmax(240px, 1fr); gap: 18px;
    grid-template-areas: "bar bar bar donut" "area area kal donut" "adhoc adhoc tunggak tunggak";
  }
  .g-bar { grid-area: bar; } .g-donut { grid-area: donut; } .g-area { grid-area: area; } .g-kal { grid-area: kal; }
  .g-adhoc { grid-area: adhoc; } .g-tunggak { grid-area: tunggak; }
  .carta { position: relative; height: 230px; }
  .donut-bungkus { position: relative; width: 170px; height: 170px; margin: 6px auto 14px; }
  .donut-tengah { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
  .donut-tengah b { font-size: 30px; font-weight: 600; display: block; }
  .donut-tengah span { font-size: 11px; color: var(--teks-2); }
  .g-donut .tab { overflow: visible; }
  .g-donut .tab button { flex: 1; padding: 8px 4px; }
  .kedudukan li { padding: 8px 0; }
  .kedudukan .nombor { width: 22px; font-weight: 700; color: var(--teks-2); font-size: 12px; }
  .kedudukan .skor { font-weight: 700; font-size: 13px; }
  .kal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; font-size: 11px; }
  .kal-grid .hari { color: var(--teks-2); font-weight: 600; padding: 4px 0; }
  .kal-grid button { border: 0; background: none; padding: 6px 0; border-radius: 4px; cursor: pointer; font-size: 11px; color: var(--teks); }
  .kal-grid button.dilaksana { background: var(--navy); color: #fff; font-weight: 700; }
  .kal-grid button.dijadual { background: var(--oren); color: var(--navy); font-weight: 700; }
  .kal-grid button.hariini { box-shadow: inset 0 0 0 1.5px var(--navy-3); }
  .kal-petunjuk { display: flex; gap: 12px; font-size: 11px; color: var(--teks-2); margin-top: 10px; }
  .kal-petunjuk i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

  /* ---------- Log masuk ---------- */
  .log-masuk { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
  .lm-jenama { background: var(--navy); color: #fff; padding: 48px; display: flex; flex-direction: column; justify-content: center; }
  .lm-jenama h1 { font-size: 48px; font-weight: 800; margin: 0 0 14px; line-height: 1.08; letter-spacing: -.01em; }
  .lm-jenama p { opacity: .78; max-width: 400px; font-size: 15px; }
  .lm-logo { width: 132px; height: 132px; padding: 6px; background: #fff; border-radius: 50%; box-shadow: 0 8px 24px rgba(0,0,0,.25); margin-bottom: 22px; }
  .lm-org { color: var(--oren); font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 12px; }
  .lm-jenama .garis-oren { width: 56px; height: 4px; background: var(--oren); border-radius: 2px; margin-bottom: 20px; }
  .lm-borang { display: grid; place-items: center; padding: 32px 16px; }
  .lm-borang .kad { width: min(420px, 100%); padding: 28px; }
  .lm-borang h2 { margin: 0 0 6px; font-size: 20px; }
  .lm-borang p.sub { margin: 0 0 20px; color: var(--teks-2); font-size: 13px; }
  .kod-input { letter-spacing: .5em; font-size: 22px !important; text-align: center; font-weight: 700; }
  .cadangan { max-height: 220px; overflow-y: auto; border: 1.5px solid var(--garis); border-radius: 6px; margin-top: 4px; }
  .cadangan button { display: block; width: 100%; text-align: left; border: 0; background: #fff; padding: 9px 12px; cursor: pointer; border-bottom: 1px solid #EEF1F5; }
  .cadangan button:hover, .cadangan button.pilih { background: #F3F6FB; }
  .cadangan small { color: var(--teks-2); display: block; }

  /* ---------- Responsif ---------- */
  @media (max-width: 1180px) {
    .grid-dash { grid-template-columns: repeat(2, minmax(0,1fr)); grid-template-areas: "bar bar" "donut kal" "area area" "adhoc adhoc" "tunggak tunggak"; }
  }
  @media (max-width: 900px) {
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); transition: transform .2s; }
    .aplikasi.laci-buka .sidebar { transform: none; }
    .aplikasi.laci-buka .latar-laci { display: block; position: fixed; inset: 0; background: rgba(27,43,75,.45); z-index: 20; }
    .butang-menu { display: inline-flex; }
    .grid-kad { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .bar-atas { padding: 14px 16px 6px; }
    .kandungan { padding: 6px 16px 32px; }
    .log-masuk { grid-template-columns: 1fr; }
    .lm-jenama { padding: 32px 20px; }
    .lm-jenama h1 { font-size: 34px; }
    .lm-logo { width: 88px; height: 88px; padding: 4px; margin-bottom: 14px; }
    .lm-org { font-size: 11px; margin-bottom: 8px; }
  }
  @media (max-width: 620px) {
    .grid-dash { grid-template-columns: minmax(0,1fr); grid-template-areas: "bar" "donut" "kal" "area" "adhoc" "tunggak"; }
    .kad-angka .nilai { font-size: 26px; }
    .kad-angka { min-height: 98px; padding: 14px; }
    .penapis select { flex: 1 1 140px; max-width: none; min-width: 0; width: 0; }
  }

  /* ---------- Cetak ---------- */
  .cetak-halaman { background: #fff; max-width: 820px; margin: 0 auto; padding: 32px; box-shadow: var(--bayang); }
  .cetak-halaman h1 { font-size: 20px; margin: 0; }
  .cetak-jenama { display: flex; align-items: center; gap: 14px; }
  .logo-cetak { width: 64px; height: 64px; flex: 0 0 64px; }
  .cetak-halaman h2 { font-size: 14px; margin: 22px 0 8px; padding-bottom: 4px; border-bottom: 2px solid var(--navy); }
  .cetak-angka { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 16px; }
  .cetak-angka div { border: 1px solid var(--garis); border-radius: 6px; padding: 10px; }
  .cetak-angka b { display: block; font-size: 22px; }
  .cetak-angka span { font-size: 11px; color: var(--teks-2); }
  @media print {
    @page { size: A4; margin: 14mm; }
    body { background: #fff; }
    .sidebar, .bar-atas, .tiada-cetak, .toast { display: none !important; }
    .kandungan { padding: 0; }
    .cetak-halaman { box-shadow: none; padding: 0; max-width: none; }
    .jadual tr { break-inside: avoid; }
  }
  /* v9: lencana menu, pemilih entiti terlibat */
  .lencana-menu { margin-left: auto; background: var(--oren); color: var(--navy); font-size: 11px; font-weight: 800; border-radius: 999px; padding: 1px 8px; min-width: 20px; text-align: center; }
  .kotak-terlibat { border: 1.5px solid var(--garis); border-radius: 8px; padding: 4px 10px 8px; max-height: 210px; overflow: auto; }
  .grid-entiti { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 2px 8px; }
  .pilih-entiti { display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 3px 0; cursor: pointer; }
  .pilih-entiti input { width: 16px; height: 16px; }
</style>

  <script>var API_URL = 'https://script.google.com/macros/s/AKfycbyxS3RX1CqidajiDYVPxlQcMtDVoKAOZmuMsa9KkjcjRUStyfj01BHnyomyfVfi_azBSQ/exec';</script>
</head>
<body>
  <div id="akar"><div class="memuat"><div class="putar"></div></div></div>

  <template id="tpl-aplikasi">
    <div class="aplikasi" id="aplikasi">
      <aside class="sidebar" id="sidebar">
        <div class="jenama-sidebar">
          <img class="logo-sidebar" id="logo-sidebar" alt="Logo Dewan Pemuda PAS Kawasan Gombak">
          <div class="jenama-teks"><b>Sistem KPI</b><span>DPPG Gombak</span></div>
        </div>
        <div class="profil" id="profil" title="Kemas kini profil">
          <div class="avatar" id="avatar"></div>
          <div class="profil-nama" id="profil-nama"></div>
          <div class="profil-jawatan" id="profil-jawatan"></div>
          <span class="profil-entiti" id="profil-entiti"></span>
        </div>
        <ul class="menu" id="menu"></ul>
        <div class="sidebar-kaki">Sistem KPI UKJ &amp; Lajnah · DPPG Gombak</div>
      </aside>
      <div class="latar-laci" id="latar-laci"></div>
      <main class="utama">
        <div class="bar-atas">
          <button class="butang-menu" id="butang-menu" aria-label="Menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <h1 id="tajuk"></h1>
          <div id="aksi-atas"></div>
        </div>
        <div class="kandungan" id="kandungan"></div>
      </main>
    </div>
  </template>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

// Ciri yang dibuka untuk pengguna ini (dari pelayan). Tiada data = dibuka; pelayan tetap menguatkuasakan.
function bolehCiri(nama) { return !KEADAAN.ciri || KEADAAN.ciri[nama] !== false; }
function adalahKetua() { return KEADAAN.pengguna && (KEADAAN.pengguna.peranan === 'KETUA' || adalahAdmin()); }
function inisial(nama) {
  var bahagian = String(nama || '?').replace(/\b(bin|binti|b\.|bt\.?)\b.*$/i, '').trim().split(/\s+/);
  return ((bahagian[0] || '?')[0] + ((bahagian[1] || '')[0] || '')).toUpperCase();
}
function pilihanEntiti(terpilih, opsyen) {
  opsyen = opsyen || {};
  var aktif = KEADAAN.entiti.filter(function (e) { return String(e.aktif).toUpperCase() !== 'FALSE'; });
  var kumpul = function (jenis, label) {
    var o = aktif.filter(function (e) { return e.jenis === jenis; }).map(function (e) {
      return '<option value="' + esc(e.id) + '"' + (e.id === terpilih ? ' selected' : '') + '>' + esc(e.kod + ' — ' + e.nama) + '</option>';
    }).join('');
    return o ? '<optgroup label="' + label + '">' + o + '</optgroup>' : '';
  };
  return (opsyen.kosong !== undefined ? '<option value="">' + esc(opsyen.kosong) + '</option>' : '') + kumpul('UKJ', 'UKJ') + kumpul('LAJNAH', 'Lajnah / Jabatan');

// v9: senarai kotak semak entiti terlibat (UKJ & Lajnah), tanpa pemilik. Baca dengan bacaTerlibat().
function pilihTerlibat(terpilih, pemilikId) {
  var pilih = String(terpilih || '').split(',');
  var aktif = KEADAAN.entiti.filter(function (e) { return String(e.aktif).toUpperCase() !== 'FALSE' && e.id !== pemilikId; });
  var kumpul = function (jenis, label) {

      return '<label class="pilih-entiti" title="' + esc(e.nama) + '"><input type="checkbox" data-terlibat="' + esc(e.id) + '"' + (pilih.indexOf(e.id) >= 0 ? ' checked' : '') + '> ' + esc(e.kod) + '</label>';
    }).join('');

  };

function bacaTerlibat(akar) {

// v9: kapsyen media sosial bagi satu laporan (templat, tanpa AI). selepas = fungsi dipanggil bila ditutup.

// Kemas kini lencana "laporan menunggu" pada menu (penyemak sahaja).
function segarkanMenunggu() {
  if (!KEADAAN.penyemak) return Promise.resolve();
  return apiT('apiLaporanMenunggu').then(function (s) { KEADAAN.bilMenunggu = s.length; lukisMenu(); }).catch(function () {});
}

function toast(mesej, jenis) {
  var t = document.createElement('div');
  t.className = 'toast' + (jenis === 'ralat' ? ' ralat' : '');
  t.textContent = mesej;
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, jenis === 'ralat' ? 5000 : 2800);
}

function memuat(el) { el.innerHTML = '<div class="memuat"><div class="putar"></div></div>'; }
function ralatDalam(el, e) { el.innerHTML = '<div class="kad kosong">' + esc(e.message || e) + '</div>'; }

// Modal ringkas. kandungan = html; butang = [{label, kelas, tindakan(dialog) -> Promise|void}]
function modal(tajuk, kandungan, butang) {
  var d = document.createElement('dialog');
  d.className = 'modal';
  d.innerHTML = '<div class="modal-kepala"><h2>' + esc(tajuk) + '</h2><button type="button" aria-label="Tutup">×</button></div>' +
    '<div class="modal-badan">' + kandungan + '</div>' +
    '<div class="modal-kaki"></div>';
  var kaki = $('.modal-kaki', d);
  (butang || [{ label: 'Tutup', kelas: 'garis' }]).forEach(function (b) {
    var el = document.createElement('button');
    el.type = 'button';
    el.className = 'butang ' + (b.kelas || '');
    el.textContent = b.label;
    el.onclick = function () {
      if (!b.tindakan) { d.close(); return; }
      el.disabled = true;
      Promise.resolve(b.tindakan(d)).then(function (tutup) { if (tutup !== false) d.close(); })
        .catch(function (e) { toast(e.message, 'ralat'); })
        .then(function () { el.disabled = false; });
    };
    kaki.appendChild(el);
  });
  $('.modal-kepala button', d).onclick = function () { d.close(); };
  d.addEventListener('close', function () { d.remove(); });
  document.body.appendChild(d);
  d.showModal();
  return d;
}

// Dialog sahkan → Promise<boolean>.
function sahkan(tajuk, mesejHtml, labelTeruskan) {
  return new Promise(function (selesai) {
    var dipilih = false;
    var d = modal(tajuk, mesejHtml, [
      { label: 'Batal', kelas: 'garis' },
      { label: labelTeruskan || 'Teruskan', kelas: 'oren', tindakan: function () { dipilih = true; } },
    ]);
    d.addEventListener('close', function () { selesai(dipilih); });
  });
}

function nilaiBorang(akar) {
  var o = {};
  $$('[name]', akar).forEach(function (el) {
    if (el.type === 'checkbox') o[el.name] = el.checked;
    else if (el.type === 'file') return;
    else if (el.multiple) o[el.name] = Array.prototype.slice.call(el.selectedOptions).map(function (x) { return x.value; }).join(',');
    else o[el.name] = el.value;
  });
  return o;
}

// Kecilkan gambar ke 1600px JPEG 0.8
function kecilkanGambar(fail) {
  return new Promise(function (selesai, gagal) {
    if (!fail) { selesai(null); return; }
    var r = new FileReader();
    r.onerror = function () { gagal(new Error('Gambar tidak dapat dibaca.')); };
    r.onload = function () {
      var img = new Image();
      img.onerror = function () { gagal(new Error('Fail bukan gambar yang sah.')); };
      img.onload = function () {
        var skala = Math.min(1, 1600 / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * skala); c.height = Math.round(img.height * skala);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var data = c.toDataURL('image/jpeg', 0.8);
        selesai({ base64: data.split(',')[1], mime: 'image/jpeg', nama: 'laporan-' + Date.now() + '.jpg' });
      };
      img.src = r.result;
    };
    r.readAsDataURL(fail);
  });
}

// ---------- Cangkerang & navigasi ----------
function binaCangkerang() {

  lukisMenu();

  $('#latar-laci').onclick = function () { $('#aplikasi').classList.remove('laci-buka'); };

function lukisMenu() {
  $('#menu').innerHTML = MENU.filter(function (m) {
    return (!m.admin || adalahAdmin()) && (!m.ciri || bolehCiri(m.ciri)) && (!m.penyemak || KEADAAN.penyemak);
  }).map(function (m) {
    var lencana = m.id === 'semak' && KEADAAN.bilMenunggu ? '<span class="lencana-menu">' + KEADAAN.bilMenunggu + '</span>' : '';
    return '<li><button data-halaman="' + m.id + '"' + (m.id === KEADAAN.halaman ? ' class="aktif"' : '') + '>' + IKON[m.id] + '<span>' + m.label + '</span>' + lencana + '</button></li>';
  }).join('') + '<li><button data-halaman="keluar">' + IKON.keluar + '<span>Log keluar</span></button></li>';
  $$('#menu button').forEach(function (b) {
    b.onclick = function () {
      if (b.dataset.halaman === 'keluar') { logKeluar(); return; }
      navigasi(b.dataset.halaman);
    };
  });
}

function navigasi(halaman, param) {
  var v = PAPARAN[halaman];
  if (!v) return;
  KEADAAN.halaman = halaman;
  $$('#menu button').forEach(function (b) { b.classList.toggle('aktif', b.dataset.halaman === halaman); });
  $('#aplikasi').classList.remove('laci-buka');
  $('#tajuk').textContent = v.tajuk;
  $('#aksi-atas').innerHTML = '';
  var el = $('#kandungan');
  memuat(el);
  window.scrollTo(0, 0);
  Promise.resolve(v.render(el, param || {})).catch(function (e) { ralatDalam(el, e); });
}

function bukaProfil() {
  var p = KEADAAN.pengguna;
  modal('Profil saya',
    '<div class="medan"><label>Emel</label><input value="' + esc(p.emel) + '" disabled></div>' +
    '<div class="medan"><label>Nama penuh</label><input name="nama" value="' + esc(p.nama) + '"></div>' +
    '<div class="medan"><label>No. telefon</label><input name="telefon" value="' + esc(p.telefon) + '"></div>' +
    '<div class="medan"><label>Jawatan · Entiti · Peranan</label><input value="' + esc((p.jawatan || '') + ' · ' + namaEntiti(p.entiti_id) + ' · ' + labelPeranan(p.peranan)) + '" disabled>' +
    '<span class="bantu">Jawatan, entiti dan peranan hanya boleh diubah oleh Admin.</span></div>',
    [{ label: 'Batal', kelas: 'garis' }, { label: 'Simpan', tindakan: function (d) {
      return apiT('apiKemasProfil', nilaiBorang(d)).then(function (baru) {
        KEADAAN.pengguna = baru; binaCangkerang(); navigasi(KEADAAN.halaman || 'utama'); toast('Profil dikemas kini.');
      });
    } }]);
}

function logKeluar() {
  var t = KEADAAN.token;
  buangToken();
  if (t) api('apiLogKeluar', t).catch(function () {});
  paparLogin('emel');
}

function masukAplikasi(data) {
  KEADAAN.pengguna = data.pengguna;
  KEADAAN.entiti = data.entiti;
  KEADAAN.penyemak = !!data.penyemak;
  KEADAAN.bilMenunggu = data.bilMenunggu || 0;
  KEADAAN.tetapan = data.tetapan;
  KEADAAN.hariIni = data.hariIni;
  KEADAAN.ciri = data.ciri || null;
  KEADAAN.ciriTetapan = data.ciriTetapan || null;
  binaCangkerang();
  navigasi('utama');
}

function mula() {
  var t = bacaToken();
  if (!t) { paparLogin('emel'); return; }
  KEADAAN.token = t;
  api('apiMulaApp', t).then(function (d) {
    if (d.status === 'AKTIF') masukAplikasi(d);
    else paparLogin(d.status === 'MENUNGGU' ? 'menunggu' : 'akses', d);
  }).catch(function () { paparLogin('emel'); });
}
</script>

  <script>
// ===================== Log masuk, OTP & Minta Akses =====================
var LOGIN = { emel: '' };

function paparLogin(mod, data) {
  var akar = $('#akar');
  akar.innerHTML =
    '<div class="log-masuk">' +
      '<section class="lm-jenama">' +
        '<img class="lm-logo" src="' + LOGO_DPPG + '" alt="Logo Dewan Pemuda PAS Kawasan Gombak">' +
        '<div class="lm-org">Dewan Pemuda PAS Kawasan Gombak</div>' +
        '<div class="garis-oren"></div>' +

        '<p>Jejak program dirancang berbanding dilaksana, kehadiran dan Skor KPI setiap UKJ dan Lajnah Dewan Pemuda PAS Gombak.</p>' +
      '</section>' +
      '<section class="lm-borang"><div class="kad" id="lm-kad"></div></section>' +
    '</div>';
  var kad = $('#lm-kad');
  if (mod === 'kod') return borangKod(kad);
  if (mod === 'akses') return borangAkses(kad, data);
  if (mod === 'menunggu') return skrinMenunggu(kad);
  borangEmel(kad);
}

function borangEmel(kad) {
  kad.innerHTML =
    '<h2>Log masuk</h2><p class="sub">Masukkan emel anda. Kami akan hantar kod 6 digit ke emel tersebut.</p>' +
    '<form id="f-emel"><div class="medan"><label for="emel">Emel</label>' +
    '<input id="emel" name="emel" type="email" autocomplete="email" required placeholder="nama@gmail.com" value="' + esc(LOGIN.emel) + '"></div>' +
    '<button class="butang besar" type="submit">Hantar kod</button></form>';
  $('#f-emel').onsubmit = function (ev) {

    var b = $('button', ev.target);

    b.disabled = true;
    api('apiMintaKod', LOGIN.emel).then(function () {
      toast('Kod telah dihantar ke ' + LOGIN.emel);
      borangKod(kad);
    }).catch(function (e) {
      if (/tunggu 1 minit/.test(e.message)) { borangKod(kad); toast(e.message); return; }
      toast(e.message, 'ralat');

function borangKod(kad) {
  kad.innerHTML =
    '<h2>Masukkan kod</h2><p class="sub">Kod dihantar ke <b>' + esc(LOGIN.emel) + '</b>. Semak juga folder Spam. Kod sah 10 minit.</p>' +
    '<form id="f-kod"><div class="medan"><label for="kod">Kod 6 digit</label>' +

    '<button class="butang besar" type="submit">Masuk</button></form>' +

  $('#kod').focus();
  $('#tukar-emel').onclick = function (ev) { ev.preventDefault(); borangEmel(kad); };
  $('#hantar-semula').onclick = function (ev) {

  };

      simpanToken(r.token);

      else borangAkses(kad, d);

function borangAkses(kad, d) {
  KEADAAN.entiti = d.entiti || KEADAAN.entiti;
  var draf = d.cadangan ? [d.cadangan] : [];
  var pilih = d.cadangan ? d.cadangan.id : '';
  kad.innerHTML =
    '<h2>Minta akses</h2><p class="sub">Emel <b>' + esc(d.emel) + '</b> belum berdaftar. Cari nama anda dalam senarai AJK, semak butiran, kemudian hantar untuk kelulusan Admin.</p>' +

      '<div class="medan"><label for="cari">Cari nama anda</label><input id="cari" placeholder="Taip sebahagian nama…" autocomplete="off">' +

      '<div class="medan"><label>Nama penuh</label><input name="nama" id="a-nama" required></div>' +

      '<button class="butang besar" type="submit">Hantar permohonan</button>' +

  var pilihDraf = function (x) {
    $('#draf_id').value = x ? x.id : '';

      $('#a-nama').value = x.nama;
      $('#a-entiti').value = x.entiti_id || '';
      $('#a-jawatan').value = x.jawatan || '';
    }
    lukis();
  };
  var lukis = function () {
    var q = $('#cari').value.trim();
    $('#senarai-draf').innerHTML = draf.map(function (x) {
      return '<button type="button" data-id="' + esc(x.id) + '" class="' + (x.id === $('#draf_id').value ? 'pilih' : '') + '">' + esc(x.nama) + '<small>' + esc(kodEntiti(x.entiti_id)) + '</small></button>';

  $('#f-akses').onsubmit = function (ev) {

function skrinMenunggu(kad) {

function warnaDari(p) {
  if (p === null || p === undefined) return 'KOSONG';
  var pc = Math.round(p * 1000) / 10;
  return pc >= KEADAAN.tetapan.AMBANG_HIJAU ? 'HIJAU' : pc >= KEADAAN.tetapan.AMBANG_KUNING ? 'KUNING' : 'MERAH';
}

function lukisCarta(d) {
  if (typeof Chart === 'undefined') {
    $$('.carta').forEach(function (c) { c.innerHTML = '<div class="kosong">Carta tidak dapat dimuat (tiada sambungan ke cdnjs).</div>'; });
    return;
  }
  Chart.defaults.font.family = "'Plus Jakarta Sans', system-ui, sans-serif";
  Chart.defaults.color = '#5B6B85';
  var label = d.siri.map(function (s) { return BULAN_PENDEK[Number(s.bulan.slice(5, 7)) - 1]; });
  var paksi = { grid: { color: '#EEF1F5' }, border: { display: false }, beginAtZero: true };
  DASH.carta.push(new Chart($('#c-bar'), {
    type: 'bar',
    data: { labels: label, datasets: [
      { label: 'Dirancang', data: d.siri.map(function (s) { return s.dirancang; }), backgroundColor: '#1B2B4B', borderRadius: 3, maxBarThickness: 22 },
      { label: 'Dilaksana', data: d.siri.map(function (s) { return s.dilaksana; }), backgroundColor: '#F5A524', borderRadius: 3, maxBarThickness: 22 },
    ] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, border: { display: false } }, y: paksi } },
  }));
  DASH.carta.push(new Chart($('#c-area'), {
    type: 'line',
    data: { labels: label, datasets: [
      { label: 'Kehadiran', data: d.siri.map(function (s) { return s.hadirPelan; }), borderColor: '#1B2B4B', backgroundColor: 'rgba(27,43,75,.35)', fill: true, tension: .4, pointRadius: 3 },
    ] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, border: { display: false } }, y: paksi } },
  }));
  var skor = d.kad.skor === null || d.kad.skor === undefined ? 0 : Math.max(0, Math.min(1, d.kad.skor));
  DASH.carta.push(new Chart($('#c-donut'), {
    type: 'doughnut',
    data: { datasets: [{ data: [skor, 1 - skor], backgroundColor: ['#F5A524', '#1B2B4B'], borderWidth: 0 }] },
    options: { cutout: '72%', plugins: { legend: { display: false }, tooltip: { enabled: false } }, events: [] },
  }));
}

function lukisKedudukan(d) {
  if (!$('#senarai-ked')) return;
  var lukis = function () {
    $$('#tab-ked button').forEach(function (b) { b.classList.toggle('aktif', b.dataset.t === DASH.tabKedudukan); });
    var senarai = d.kedudukan[DASH.tabKedudukan] || [];
    $('#senarai-ked').innerHTML = senarai.length ? senarai.map(function (r, i) {
      var nama = r.kod || kodEntiti(r.entitiId);
      var id = r.entitiId || '';
      return '<li' + (id ? ' data-id="' + esc(id) + '" style="cursor:pointer"' : '') + '><span class="nombor">' + (i + 1) + '</span>' +
        '<div class="isi"><div class="tajuk" title="' + esc(r.nama) + '">' + esc(nama) + '</div></div>' +

function lukisKalendar(kal, ym) {
  var y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7));
  $('#kal-tajuk').textContent = bulanPaparan(ym);
  var hariPertama = (new Date(Date.UTC(y, m - 1, 1)).getUTCDay() + 6) % 7; // Isnin = 0
  var bilHari = new Date(Date.UTC(y, m, 0)).getUTCDate();
  var html = ['Isn', 'Sel', 'Rab', 'Kha', 'Jum', 'Sab', 'Ahd'].map(function (h) { return '<div class="hari">' + h + '</div>'; }).join('');
  for (var i = 0; i < hariPertama; i++) html += '<div></div>';
  for (var d = 1; d <= bilHari; d++) {
    var t = ym + '-' + (d < 10 ? '0' : '') + d;
    var kelas = kal.dilaksana.indexOf(t) >= 0 ? 'dilaksana' : kal.dijadual.indexOf(t) >= 0 ? 'dijadual' : '';
    if (t === KEADAAN.hariIni) kelas += ' hariini';
    html += '<button type="button" data-t="' + t + '" class="' + kelas + '">' + d + '</button>';
  }
  $('#kal-grid').innerHTML = html;
  var paparAcara = function (tarikh) {
    var acara = kal.acara.filter(function (a) { return !tarikh || a.tarikh === tarikh; }).slice(0, tarikh ? 20 : 4);
    $('#kal-acara').innerHTML = acara.map(function (a) {
      return '<li><div class="isi"><div class="tajuk" style="font-size:12px">' + esc(a.nama) + '</div><div class="kecil">' + tarikhPaparan(a.tarikh) + '</div></div>' +
        '<span class="tag ' + (a.jenis === 'DILAKSANA' ? 'navy' : 'oren') + '">' + (a.jenis === 'DILAKSANA' ? 'Dilaksana' : 'Dijadual') + '</span></li>';
    }).join('') || '<li class="kecil" style="color:var(--teks-2)">' + (tarikh ? 'Tiada program pada ' + tarikhPaparan(tarikh) + '.' : 'Tiada program bulan ini.') + '</li>';
  };
  $$('#kal-grid button').forEach(function (b) { b.onclick = function () { paparAcara(b.dataset.t); }; });
  paparAcara('');
}

// ===================== Ringkasan WhatsApp (v7) =====================
// Admin: mana-mana entiti atau Kawasan; Ketua/PIC: entiti sendiri sahaja (pelayan juga menyekat).
function bukaRingkasanWA(entitiAwal) {
  var admin = adalahAdmin();
  var sendiri = KEADAAN.pengguna.entiti_id || '';
  var skop = admin ? (entitiAwal || 'KAWASAN') : sendiri;
  var bulanIni = KEADAAN.hariIni.slice(0, 7);
  var pilihSkop = admin
    ? '<option value="KAWASAN">Kawasan (semua UKJ & Lajnah)</option>' + pilihanEntiti(skop)
    : '<option value="' + esc(sendiri) + '">' + esc(kodEntiti(sendiri) + ' — ' + namaEntiti(sendiri)) + '</option>';
  var teks = '';
  var d = modal('Ringkasan WhatsApp',
    '<div class="baris-medan">' +
      '<div class="medan"><label>Tempoh</label><select id="wa-bulan"><option value="' + bulanIni + '">' + bulanPaparan(bulanIni) + ' (bulan ini)</option><option value="KUMULATIF">Kumulatif</option>' +
        senaraiBulan().filter(function (ym) { return ym !== bulanIni; }).map(function (ym) { return '<option value="' + ym + '">' + bulanPaparan(ym) + '</option>'; }).join('') + '</select></div>' +
      '<div class="medan"><label>Untuk</label><select id="wa-skop"' + (admin ? '' : ' disabled') + '>' + pilihSkop + '</select></div>' +
    '</div>' +
    '<div class="medan"><label>Mesej</label><textarea id="wa-teks" rows="14" readonly style="font-family:inherit;font-size:13px"></textarea>' +
    '<span class="bantu">Salin dan tampal ke kumpulan WhatsApp, atau tekan Kongsi ke WhatsApp.</span></div>',
    [
      { label: 'Tutup', kelas: 'garis' },
      { label: 'Salin', kelas: 'garis', tindakan: function () { salinTeks(teks, $('#wa-teks', d)); return false; } },
      { label: 'Kongsi ke WhatsApp', kelas: 'oren', tindakan: function () {
        if (teks) window.open('https://wa.me/?text=' + encodeURIComponent(teks), '_blank');
        return false;
      } },
    ]);
  $('#wa-skop', d).value = skop;
  var jana = function () {
    var s = $('#wa-skop', d).value;
    var o = s === 'KAWASAN' ? { bulan: $('#wa-bulan', d).value, kawasan: true } : { bulan: $('#wa-bulan', d).value, entiti_id: s };
    teks = '';
    $('#wa-teks', d).value = 'Menjana…';
    apiT('apiRingkasanWA', o).then(function (t) { teks = t; $('#wa-teks', d).value = t; })
      .catch(function (e) { $('#wa-teks', d).value = ''; toast(e.message, 'ralat'); });
  };
  $('#wa-bulan', d).onchange = jana;
  $('#wa-skop', d).onchange = jana;
  jana();
}

function salinTeks(teks, kawasanTeks) {
  if (!teks) return;
  var sandaran = function () {
    kawasanTeks.focus(); kawasanTeks.select();
    try { document.execCommand('copy'); toast('Mesej disalin.'); } catch (e) { toast('Pilih teks dan salin secara manual.', 'ralat'); }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(teks).then(function () { toast('Mesej disalin.'); }, sandaran);
  } else {
    sandaran();
  }
}

            '<label style="display:flex;gap:8px;align-items:center;margin-bottom:14px"><input type="checkbox" id="h-cw"> Jana copywriting media sosial selepas hantar</label>' +
            '<button class="butang besar" type="submit">Hantar laporan</button>' +
            '<p class="kecil" style="color:var(--teks-2);margin-top:10px">Laporan akan disemak oleh Setiausaha / PSU I sebelum dikira dalam KPI.</p>' +
          '</form>' +
        '</div>';
      var lukisTerlibat = function () { $('#h-terlibat').innerHTML = pilihTerlibat('', $('#h-pemilik').value); };
      var setBaru = function (a) {
        baru = a;
        $$('#h-suis button').forEach(function (b) { b.classList.toggle('aktif', (b.dataset.a === '1') === a); });
        $('#h-pelan').hidden = a; $('#h-baru').hidden = !a;
        kemasMedanJenis();
      };
      var kemasMedanJenis = function () {
        var it = baru ? null : bolehHantar.filter(function (i) { return i.id === $('#h-item').value; })[0];
        var jenis = it ? it.jenis : 'SEKALI';
        $('#h-kuantiti').hidden = jenis !== 'KUANTITI';
        $('#h-siap').hidden = jenis !== 'SIAP';
        $('#h-info').innerHTML = it ? esc(namaEntiti(it.entiti_id)) + ' · ' + labelJenis(it) + ' · capaian ' + fmtPeratus(it.peratus) : '';
      };
      $$('#h-suis button').forEach(function (b) { b.onclick = function () { setBaru(b.dataset.a === '1'); }; });
      $('#h-item').onchange = kemasMedanJenis;
      $('#h-pemilik').onchange = lukisTerlibat;
      lukisTerlibat();
      setBaru(baru || !bolehHantar.length);
      $('#f-lapor').onsubmit = function (ev) {
        ev.preventDefault();
        var b = $('button[type=submit]', ev.target);
        var data = nilaiBorang(ev.target);
        var input = { tarikh: data.tarikh, jumlah_hadir: data.jumlah_hadir, kuantiti: data.kuantiti, siap: data.siap, lokasi: data.lokasi, catatan: data.catatan, gambar_url: data.gambar_url };
        if (baru) {
          if (!String(data.nama_program || '').trim()) { toast('Nama program wajib diisi.', 'ralat'); return; }
          input.program_baru = { nama_program: data.nama_program, entiti_id: data.entiti_id, target_peserta: data.target_peserta, lajnah_terlibat: bacaTerlibat($('#h-terlibat')) };
        } else {
          if (!data.item_id) { toast('Sila pilih program.', 'ralat'); return; }
          input.item_id = data.item_id;
        }
        var cw = $('#h-cw').checked;
        b.disabled = true; b.textContent = 'Menghantar…';
        kecilkanGambar($('#h-gambar').files[0]).then(function (g) {
          return apiT('apiHantarLaporan', input, g);
        }).then(function (l) {
          toast('Laporan dihantar dan menunggu semakan. Terima kasih!');
          LAPORAN.items = null;
          segarkanMenunggu();
          if (cw) bukaCopywriting(l.id, function () { navigasi('saya'); });
          else navigasi('saya');
        }).catch(function (e) { toast(e.message, 'ralat'); b.disabled = false; b.textContent = 'Hantar laporan'; });
      };
    });
  },
};

function labelJenis(it) {
  var unit = { MINGGU: 'seminggu', BULAN: 'sebulan', JUMLAH: 'jumlah' };
  if (it.jenis === 'BERULANG') {
    var bil = Number(it.kekerapan_bil), setiap = Number(it.kekerapan_setiap) || 1;
    var u = it.kekerapan_unit === 'MINGGU' ? 'minggu' : 'bulan';
    if (setiap > 1) return bil + 'x setiap ' + setiap + ' ' + u;
    return bil + 'x ' + (unit[it.kekerapan_unit] || '');
  }
  if (it.jenis === 'SEKALI') return 'Sekali · ' + tarikhPaparan(it.tarikh_sasaran);
  if (it.jenis === 'SIAP') return 'Siap · ' + tarikhPaparan(it.tarikh_sasaran);
  if (it.jenis === 'KUANTITI') return 'Target ' + it.target_kuantiti + ' ' + (it.kuantiti_unit === 'JUMLAH' ? '(jumlah)' : unit[it.kuantiti_unit]);
  return it.jenis;
}

function pilihanItem(items, terpilih) {
  if (!items.length) return '<option value="">Tiada program milik entiti anda</option>';
  var kumpul = {};
  items.forEach(function (i) { (kumpul[i.entiti_id] = kumpul[i.entiti_id] || []).push(i); });
  return '<option value="">— Pilih program —</option>' + Object.keys(kumpul).map(function (eid) {
    return '<optgroup label="' + esc(namaEntiti(eid)) + '">' + kumpul[eid].map(function (i) {
      return '<option value="' + esc(i.id) + '"' + (i.id === terpilih ? ' selected' : '') + '>' + esc(i.nama_program) + '</option>';
    }).join('') + '</optgroup>';
  }).join('');
}

// ===================== Jadual laporan (dikongsi) =====================
// opsyen: { penghantar: bool, kembali: function } — kembali dipanggil selepas sebarang tindakan.
function lukisJadualLaporan(isi, senarai, opsyen) {
  opsyen = opsyen || {};
  isi.innerHTML = '<div class="kad"><div class="jadual-bungkus"><table class="jadual"><thead><tr><th>Tarikh</th><th>Program</th><th>Entiti</th><th>Hadir</th><th>Status</th>' +
    (opsyen.penghantar ? '<th>Penghantar</th>' : '') + '<th></th></tr></thead><tbody>' +
    senarai.map(function (l) {
      return '<tr><td style="white-space:nowrap">' + tarikhPaparan(l.tarikh) + '</td>' +
        '<td><b>' + esc(l.nama_program) + '</b>' +
          (l.catatan ? '<div class="kecil" style="color:var(--teks-2)">' + esc(l.catatan) + '</div>' : '') +
          (l.lokasi ? '<div class="kecil" style="color:var(--teks-2)">📍 ' + esc(l.lokasi) + '</div>' : '') +
          (/^https?:\/\//i.test(String(l.gambar_url).trim()) ? '<div><a href="' + esc(l.gambar_url) + '" target="_blank" rel="noopener">Lihat gambar</a></div>' : '') + '</td>' +
        '<td>' + esc(kodEntiti(l.entiti_id)) + '</td>' +
        '<td>' + (l.jenis_item === 'KUANTITI' ? esc(l.kuantiti) + ' (kuantiti)' + (l.jumlah_hadir !== '' ? '<div class="kecil">' + esc(l.jumlah_hadir) + ' hadir</div>' : '')
          : l.jenis_item === 'SIAP' ? (String(l.siap).toUpperCase() === 'TRUE' ? 'Siap' : 'Belum siap')
          : esc(l.jumlah_hadir === '' ? '—' : l.jumlah_hadir)) + '</td>' +
        '<td>' + labelStatusLaporan(l) + '</td>' +
        (opsyen.penghantar ? '<td>' + esc(l.penghantar_nama) + '<div class="kecil" style="color:var(--teks-2)">' + esc(l.penghantar_jawatan || '') + '</div></td>' : '') +
        '<td><div class="aksi-sel">' +
          (l.bolehLulus && l.status !== 'DIKIRA' ? '<button class="butang kecil oren" data-lulus="' + esc(l.id) + '">Luluskan</button> ' : '') +
          (l.bolehLulus && l.status !== 'DITOLAK' ? '<button class="butang kecil bahaya" data-tolak="' + esc(l.id) + '">Tolak</button> ' : '') +
          (l.bolehEdit ? '<button class="butang kecil garis" data-edit="' + esc(l.id) + '">Edit</button> ' : '') +
          '<button class="butang kecil garis" data-cw="' + esc(l.id) + '" title="Copywriting media sosial">Kapsyen</button>' +
        '</div></td></tr>';
    }).join('') + '</tbody></table></div></div>';
  var kembali = opsyen.kembali || function () {};
  var cari = function (id) { return senarai.filter(function (l) { return l.id === id; })[0]; };
  $$('[data-edit]', isi).forEach(function (b) { b.onclick = function () { editLaporan(cari(b.dataset.edit), kembali); }; });
  $$('[data-cw]', isi).forEach(function (b) { b.onclick = function () { bukaCopywriting(b.dataset.cw); }; });
  $$('[data-lulus]', isi).forEach(function (b) {
    b.onclick = function () {
      b.disabled = true;
      apiT('apiLuluskanLaporan', b.dataset.lulus).then(function () { toast('Laporan diluluskan.'); segarkanMenunggu(); kembali(); })
        .catch(function (e) { toast(e.message, 'ralat'); b.disabled = false; });
    };
  });
  $$('[data-tolak]', isi).forEach(function (b) {
    b.onclick = function () {
      modal('Tolak laporan', '<p>Laporan yang ditolak tidak dikira dalam KPI. Penghantar boleh membetulkan dan menghantar semula.</p><div class="medan"><label>Sebab (wajib)</label><textarea name="sebab" rows="3"></textarea></div>',
        [{ label: 'Batal', kelas: 'garis' }, { label: 'Tolak laporan', kelas: 'bahaya', tindakan: function (d) {
          return apiT('apiTolakLaporan', b.dataset.tolak, nilaiBorang(d).sebab).then(function () { toast('Laporan ditolak.'); segarkanMenunggu(); kembali(); });
        } }]);
    };
  });
}

// ===================== Laporan Saya / Laporan Entiti =====================
PAPARAN.saya = {
  tajuk: 'Laporan',
  render: function (el, param) {
    var tab = param.tab || 'saya';

      '<div id="l-isi"></div>';

      lukisJadualLaporan($('#s-isi'), senarai, { penghantar: true, kembali: function () { navigasi('semak'); } });

function editLaporan(l, kembali) {
  modal('Edit laporan — ' + l.nama_program,
    (l.status === 'DITOLAK' ? '<p class="kecil" style="color:var(--merah)">Ditolak: ' + esc(l.sebab_tolak) + '. Selepas disimpan, laporan dihantar semula untuk semakan.</p>' : '') +
    '<div class="baris-medan"><div class="medan"><label>Tarikh</label><input type="date" name="tarikh" max="' + KEADAAN.hariIni + '" value="' + esc(l.tarikh) + '"></div>' +

    (l.jenis_item === 'KUANTITI' ? '<div class="medan"><label>Kuantiti</label><input type="number" step="any" name="kuantiti" value="' + esc(l.kuantiti) + '"></div>' : '') + '</div>' +
    (l.jenis_item === 'SIAP' ? '<label style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><input type="checkbox" name="siap"' + (String(l.siap).toUpperCase() === 'TRUE' ? ' checked' : '') + '> Siap</label>' : '') +
    '<div class="medan"><label>Lokasi</label><input name="lokasi" value="' + esc(l.lokasi) + '"></div>' +
    '<div class="medan"><label>Catatan</label><textarea name="catatan" rows="3">' + esc(l.catatan) + '</textarea></div>' +
    '<div class="medan"><label>Pautan gambar</label><input name="gambar_url" value="' + esc(l.gambar_url) + '"></div>',
    [{ label: 'Batal', kelas: 'garis' }, { label: 'Simpan', tindakan: function (d) {
      return apiT('apiKemasLaporan', l.id, nilaiBorang(d), null).then(function () {
        toast('Laporan dikemas kini.'); segarkanMenunggu(); if (kembali) kembali();
      });
    } }]);
}
</script>

  <script>
// ===================== Pelan =====================
var PELAN = { penapis: { entiti_id: '', status: 'AKTIF', semak: false, cari: '' } };

PAPARAN.pelan = {
  tajuk: 'Pelan Program',
  render: function (el) {
    if ((!PELAN.penapis.entiti_id || !bolehCiri('semuaEntiti')) && !adalahAdmin() && KEADAAN.pengguna.entiti_id) PELAN.penapis.entiti_id = KEADAAN.pengguna.entiti_id;
    return muatItemCache(true).then(function (items) {
      if (adalahKetua()) {
        $('#aksi-atas').innerHTML = '<button class="butang oren" id="p-tambah">+ Tambah item</button>';
        $('#p-tambah').onclick = function () { borangItem(null); };
      }
      var p = PELAN.penapis;
      el.innerHTML = '<div class="penapis">' +
        '<select data-k="entiti_id"' + (bolehCiri('semuaEntiti') ? '' : ' disabled') + '>' + pilihanEntiti(p.entiti_id, { kosong: 'Semua UKJ & Lajnah' }) + '</select>' +
        '<select data-k="status"><option value="">Semua status</option><option value="AKTIF">Aktif</option><option value="BATAL">Dibatalkan</option></select>' +
        '<label style="display:flex;align-items:center;gap:6px;background:#fff;padding:0 12px;border-radius:6px;box-shadow:var(--bayang);font-size:13px"><input type="checkbox" data-k="semak"' + (p.semak ? ' checked' : '') + '> Perlu disemak sahaja</label>' +
        '<input data-k="cari" placeholder="Cari program…" value="' + esc(p.cari) + '" style="border:0;border-radius:6px;padding:8px 10px;box-shadow:var(--bayang);flex:1;min-width:160px">' +
        '</div><div id="p-isi"></div>';
      $('select[data-k=status]', el).value = p.status;
      $$('[data-k]', el).forEach(function (s) {
        var ubah = function () { p[s.dataset.k] = s.type === 'checkbox' ? s.checked : s.value; lukisPelan(items); };
        s.onchange = ubah;
        if (s.tagName === 'INPUT' && s.type !== 'checkbox') s.oninput = ubah;
      });
      lukisPelan(items);
    });
  },
};

function lukisPelan(items) {
  var p = PELAN.penapis;
  var q = p.cari.trim().toLowerCase();
  var tapis = items.filter(function (i) {
    if (p.entiti_id && i.entiti_id !== p.entiti_id && String(i.lajnah_terlibat).split(',').indexOf(p.entiti_id) < 0) return false;
    if (p.status && i.status !== p.status) return false;
    if (p.semak && String(i.perlu_disemak).toUpperCase() !== 'TRUE') return false;
    if (q && (i.nama_program + ' ' + i.objektif).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  var isi = $('#p-isi');
  if (!tapis.length) { isi.innerHTML = '<div class="kad kosong">Tiada item sepadan dengan penapis.</div>'; return; }
  isi.innerHTML = '<div class="kad"><div class="kecil" style="color:var(--teks-2);margin-bottom:8px">' + tapis.length + ' item</div><div class="jadual-bungkus"><table class="jadual"><thead><tr>' +
    '<th>Program</th><th>Pemilik</th><th>Target</th><th>Capaian</th><th>PIC</th><th></th></tr></thead><tbody>' +
    tapis.map(function (i) {
      var batal = i.status === 'BATAL';
