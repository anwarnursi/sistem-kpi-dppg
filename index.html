        '<td>' + esc(kodEntiti(i.entiti_id)) + '</td>' +
        '<td style="white-space:nowrap">' + esc(labelJenis(i)) + (Number(i.target_peserta) ? '<div class="kecil">' + i.target_peserta + ' peserta/sesi</div>' : '') + '</td>' +
        '<td style="white-space:nowrap">' + lencanaWarna(i.warna, fmtPeratus(i.peratus)) +
          (i.sepatutnya ? '<div class="kecil">' + Math.round(i.dilaksana * 10) / 10 + ' / ' + Math.round(i.sepatutnya * 10) / 10 + '</div>' : '') + '</td>' +
        '<td>' + esc(i.pic_teks || '—') + '</td>' +
        '<td style="white-space:nowrap">' +
          (i.bolehHantar ? '<button class="butang kecil oren" data-lapor="' + esc(i.id) + '">Lapor</button> ' : '') +
          (i.bolehUrus ? '<button class="butang kecil garis" data-ubah="' + esc(i.id) + '">Ubah</button>'
            : i.bolehUbahTerlibat ? '<button class="butang kecil garis" data-terlibat-ubah="' + esc(i.id) + '">Entiti terlibat</button>' : '') +
        '</td></tr>';
    }).join('') + '</tbody></table></div></div>';
  var cari = function (id) { return items.filter(function (i) { return i.id === id; })[0]; };
  $$('[data-lapor]', isi).forEach(function (b) { b.onclick = function () { navigasi('hantar', { item_id: b.dataset.lapor }); }; });
  $$('[data-ubah]', isi).forEach(function (b) { b.onclick = function () { borangItem(cari(b.dataset.ubah)); }; });
  $$('[data-terlibat-ubah]', isi).forEach(function (b) { b.onclick = function () { ubahTerlibat(cari(b.dataset.terlibatUbah)); }; });
}

function borangItem(it, prasetel) {
  var baru = !it;
  it = it || prasetel || { jenis: 'BERULANG', kekerapan_bil: 1, kekerapan_setiap: 1, kekerapan_unit: 'BULAN', kuantiti_unit: 'JUMLAH', entiti_id: KEADAAN.pengguna.entiti_id };
  var d = modal(baru ? 'Tambah item pelan' : 'Ubah item pelan',
    '<div class="medan"><label>Nama program</label><input name="nama_program" value="' + esc(it.nama_program) + '"></div>' +
    '<div class="medan"><label>Objektif</label><input name="objektif" value="' + esc(it.objektif) + '"></div>' +
    '<div class="medan"><label>Pemilik</label><select name="entiti_id" id="i-pemilik"' + (adalahAdmin() ? '' : ' disabled') + '>' + pilihanEntiti(it.entiti_id) + '</select>' +
      (adalahAdmin() ? '' : '<span class="bantu">Hanya Admin boleh memindahkan item ke entiti lain.</span>') + '</div>' +
    '<div class="medan"><label>Jenis</label><select name="jenis" id="i-jenis">' +
      [['BERULANG', 'Berulang (ada kekerapan)'], ['SEKALI', 'Sekali (satu acara)'], ['KUANTITI', 'Sasaran kuantiti'], ['SIAP', 'Siap / Tidak (deliverable)']].map(function (j) {
        return '<option value="' + j[0] + '"' + (it.jenis === j[0] ? ' selected' : '') + '>' + j[1] + '</option>';
      }).join('') + '</select></div>' +
    '<div class="baris-medan" data-jenis="BERULANG">' +
      '<div class="medan"><label>Bilangan sesi (kali)</label><input type="number" step="1" min="1" name="kekerapan_bil" value="' + esc(it.kekerapan_bil) + '"></div>' +
      '<div class="medan"><label>Setiap</label><input type="number" step="1" min="1" name="kekerapan_setiap" value="' + esc(it.kekerapan_setiap || 1) + '"></div>' +
      '<div class="medan"><label>&nbsp;</label><select name="kekerapan_unit"><option value="MINGGU"' + (it.kekerapan_unit === 'MINGGU' ? ' selected' : '') + '>minggu</option><option value="BULAN"' + (it.kekerapan_unit !== 'MINGGU' ? ' selected' : '') + '>bulan</option></select></div>' +
    '</div>' +
    '<span class="bantu" data-jenis="BERULANG" style="display:block;margin:-6px 0 12px">Nombor bulat sahaja. Contoh: 2 kali setiap 1 minggu, atau 1 kali setiap 3 bulan.</span>' +
    '<div class="baris-medan" data-jenis="KUANTITI">' +
      '<div class="medan"><label>Target kuantiti</label><input type="number" step="any" min="0" name="target_kuantiti" value="' + esc(it.target_kuantiti) + '"></div>' +
      '<div class="medan"><label>Per</label><select name="kuantiti_unit">' + [['JUMLAH', 'Jumlah keseluruhan'], ['MINGGU', 'Minggu'], ['BULAN', 'Bulan']].map(function (u) {
        return '<option value="' + u[0] + '"' + (it.kuantiti_unit === u[0] ? ' selected' : '') + '>' + u[1] + '</option>';
      }).join('') + '</select></div>' +
    '</div>' +
    '<div class="baris-medan">' +
      '<div class="medan"><label>Tarikh mula</label><input type="date" name="tarikh_mula" value="' + esc(it.tarikh_mula) + '"><span class="bantu">Kosong = ikut tarikh mula sistem</span></div>' +
      '<div class="medan" data-jenis="SEKALI SIAP KUANTITI"><label>Tarikh sasaran</label><input type="date" name="tarikh_sasaran" value="' + esc(it.tarikh_sasaran) + '"></div>' +
      '<div class="medan"><label>Target peserta / sesi (pilihan)</label><input type="number" min="0" name="target_peserta" value="' + esc(it.target_peserta) + '"></div>' +
    '</div>' +
    '<div class="medan"><label>Entiti terlibat (UKJ / Lajnah)</label><div id="i-terlibat">' + pilihTerlibat(it.lajnah_terlibat, it.entiti_id) + '</div>' +
      '<span class="bantu">Program kongsi dikira untuk pemilik dan setiap entiti terlibat. Hanya pemilik melapor.</span></div>' +
    '<div class="medan"><label>PIC</label><input name="pic_teks" value="' + esc(it.pic_teks) + '" placeholder="Nama PIC"></div>' +
    (baru ? '' : '<label style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><input type="checkbox" name="perlu_disemak"' + (String(it.perlu_disemak).toUpperCase() === 'TRUE' ? ' checked' : '') + '> Perlu disemak</label>' +
      (it.catatan_semak ? '<div class="kecil" style="color:var(--teks-2);margin-bottom:10px">Catatan: ' + esc(it.catatan_semak) + '</div>' : '') +
      (it.teks_asal_kpi ? '<div class="kecil" style="color:var(--teks-2)">Teks KPI asal: “' + esc(it.teks_asal_kpi) + '”</div>' : '')),
    (baru ? [] : [it.status === 'BATAL'
      ? { label: 'Aktifkan semula', kelas: 'garis', tindakan: function () { return apiT('apiAktifkanItem', it.id).then(selepasSimpanItem); } }
      : { label: 'Batalkan item', kelas: 'bahaya', tindakan: function () { batalItem(it); } }])
      .concat([{ label: 'Tutup', kelas: 'garis' }, { label: 'Simpan', tindakan: function (dlg) {
        var data = nilaiBorang(dlg);
        data.lajnah_terlibat = bacaTerlibat($('#i-terlibat', dlg));
        if (!adalahAdmin()) delete data.entiti_id;
        if (!baru) data.id = it.id;
        return apiT('apiSimpanItem', data).then(selepasSimpanItem);
      } }]));
  var kemas = function () {
    var j = $('#i-jenis', d).value;
    $$('[data-jenis]', d).forEach(function (x) { x.hidden = x.dataset.jenis.split(' ').indexOf(j) < 0; });
  };
  $('#i-jenis', d).onchange = kemas;
  $('#i-pemilik', d).onchange = function () { $('#i-terlibat', d).innerHTML = pilihTerlibat(bacaTerlibat($('#i-terlibat', d)), $('#i-pemilik', d).value); };
  kemas();
  return d;
}

// PIC pemilik (bukan Ketua) hanya boleh ubah entiti terlibat.
function ubahTerlibat(it) {
  modal('Entiti terlibat — ' + it.nama_program,
    '<p class="kecil" style="color:var(--teks-2)">Program kongsi dikira untuk pemilik dan setiap entiti terlibat. Hanya pemilik (' + esc(kodEntiti(it.entiti_id)) + ') melapor.</p>' +
    '<div id="t-terlibat">' + pilihTerlibat(it.lajnah_terlibat, it.entiti_id) + '</div>',
    [{ label: 'Batal', kelas: 'garis' }, { label: 'Simpan', tindakan: function (d) {
      return apiT('apiKemasTerlibat', it.id, bacaTerlibat($('#t-terlibat', d))).then(selepasSimpanItem);
    } }]);
}

function selepasSimpanItem() {
  toast('Item pelan disimpan.');
  LAPORAN.items = null;
  navigasi('pelan');
}

function batalItem(it) {
  modal('Batalkan item', '<p><b>' + esc(it.nama_program) + '</b> akan dikeluarkan daripada pengiraan KPI tetapi kekal dalam senarai.</p>' +
    '<div class="medan"><label>Sebab pembatalan</label><textarea name="sebab" rows="3"></textarea></div>',
    [{ label: 'Kembali', kelas: 'garis' }, { label: 'Batalkan item', kelas: 'bahaya', tindakan: function (d) {
      return apiT('apiBatalItem', it.id, nilaiBorang(d).sebab).then(selepasSimpanItem);
    } }]);
}
</script>

  <script>
// ===================== Admin =====================
PAPARAN.admin = {
  tajuk: 'Admin',
  render: function (el, param) {
    if (!adalahAdmin()) { el.innerHTML = '<div class="kad kosong">Halaman ini untuk Admin sahaja.</div>'; return; }
    var tab = param.tab || 'pengguna';
    if (!adalahAdminPenuh() && (tab === 'tetapan' || tab === 'ciri')) tab = 'pengguna';
    el.innerHTML = '<div class="tab" id="a-tab"><button data-t="pengguna">Pengguna</button><button data-t="entiti">UKJ &amp; Lajnah</button>' +
      (adalahAdminPenuh() ? '<button data-t="ciri">Ciri pengguna</button><button data-t="tetapan">Tetapan</button>' : '') + '</div><div id="a-isi"></div>';
    $$('#a-tab button').forEach(function (b) {
      b.classList.toggle('aktif', b.dataset.t === tab);
      b.onclick = function () { navigasi('admin', { tab: b.dataset.t }); };
    });
    var isi = $('#a-isi');
    memuat(isi);
    if (tab === 'entiti') return adminEntiti(isi);
    if (tab === 'tetapan') return adminTetapan(isi);
    if (tab === 'ciri') return adminCiri(isi);
    return adminPengguna(isi, param.status || 'MENUNGGU');
  },
};

// ---------- Pengguna ----------
function adminPengguna(isi, status) {
  return apiT('apiSenaraiPengguna').then(function (semua) {
    var kira = {};
    semua.forEach(function (u) { kira[u.status] = (kira[u.status] || 0) + 1; });
    var label = { MENUNGGU: 'Menunggu', AKTIF: 'Aktif', DRAF: 'Draf', NYAHAKTIF: 'Nyahaktif' };
    $('#aksi-atas').innerHTML = '<button class="butang oren" id="u-tambah">+ Tambah pengguna</button>';
    $('#u-tambah').onclick = function () { borangPengguna(null, status); };
    var senarai = semua.filter(function (u) { return u.status === status; });
    isi.innerHTML = '<div class="suis">' + Object.keys(label).map(function (s) {
      return '<button type="button" data-s="' + s + '" class="' + (s === status ? 'aktif' : '') + '">' + label[s] + ' (' + (kira[s] || 0) + ')</button>';
    }).join('') + '</div>' +
      '<div class="kad">' + (senarai.length ? '<div class="jadual-bungkus"><table class="jadual"><thead><tr><th>Nama</th><th>Emel</th><th>Entiti</th><th>Peranan</th><th></th></tr></thead><tbody>' +
      senarai.map(function (u) {
        return '<tr><td><b>' + esc(u.nama) + '</b><div class="kecil" style="color:var(--teks-2)">' + esc(u.jawatan) + (u.telefon ? ' · ' + esc(u.telefon) : '') + '</div>' +
          (u.bendera ? '<div class="kecil" style="color:#9A5F00">' + esc(u.bendera) + '</div>' : '') + '</td>' +
          '<td>' + esc(u.emel || '—') + '</td><td>' + esc(kodEntiti(u.entiti_id)) + '</td><td><span class="tag' + (u.peranan === 'ADMIN_PENUH' ? ' navy' : '') + '">' + esc(labelPeranan(u.peranan)) + '</span></td>' +
          '<td style="white-space:nowrap">' + (bolehUbahPengguna(u) ?
            (status === 'MENUNGGU' ? '<button class="butang kecil oren" data-lulus="' + esc(u.id) + '">Semak &amp; lulus</button> ' : '') +
            '<button class="butang kecil garis" data-ubah="' + esc(u.id) + '">Ubah</button>'
            : '<span class="kecil" style="color:var(--teks-2)">Admin Penuh sahaja</span>') + '</td></tr>';
      }).join('') + '</tbody></table></div>' : '<div class="kosong">Tiada pengguna berstatus ' + label[status].toLowerCase() + '.</div>') + '</div>';
    $$('.suis button', isi).forEach(function (b) { b.onclick = function () { navigasi('admin', { tab: 'pengguna', status: b.dataset.s }); }; });
    var cari = function (id) { return semua.filter(function (u) { return u.id === id; })[0]; };
    $$('[data-ubah]', isi).forEach(function (b) { b.onclick = function () { borangPengguna(cari(b.dataset.ubah), status); }; });
    $$('[data-lulus]', isi).forEach(function (b) { b.onclick = function () { borangPengguna(cari(b.dataset.lulus), status, true); }; });
  });
}

// Admin biasa tidak boleh mengubah akaun Admin lain (pelayan juga menolak).
function bolehUbahPengguna(u) {
  return adalahAdminPenuh() || u.id === KEADAAN.pengguna.id || (u.peranan !== 'ADMIN' && u.peranan !== 'ADMIN_PENUH');
}

function pilihanPeranan(semasa) {
  var senarai = [['PIC', 'PIC — hantar laporan'], ['KETUA', 'Ketua/SU — urus pelan entiti']];
  if (adalahAdminPenuh() || semasa === 'ADMIN') senarai.push(['ADMIN', 'Admin — urus pengguna, pelan, laporan']);
  if (adalahAdminPenuh() || semasa === 'ADMIN_PENUH') senarai.push(['ADMIN_PENUH', 'Admin Penuh — semua + lantik Admin & kawal ciri']);
  return senarai.map(function (r) {
    return '<option value="' + r[0] + '"' + (semasa === r[0] ? ' selected' : '') + '>' + r[1] + '</option>';
  }).join('');
}

function borangPengguna(u, statusKembali, lulus) {
  var baru = !u;
  u = u || { peranan: 'PIC', status: 'AKTIF' };
  var diri = u.id === KEADAAN.pengguna.id;
  modal(baru ? 'Tambah pengguna' : lulus ? 'Luluskan pengguna' : 'Ubah pengguna',
    '<div class="medan"><label>Emel</label><input name="emel" type="email" value="' + esc(u.emel) + '"></div>' +
    '<div class="baris-medan"><div class="medan"><label>Nama</label><input name="nama" value="' + esc(u.nama) + '"></div>' +
      '<div class="medan"><label>Telefon</label><input name="telefon" value="' + esc(u.telefon) + '"></div></div>' +
    '<div class="baris-medan"><div class="medan"><label>Peranan</label><select name="peranan"' + (diri ? ' disabled' : '') + '>' +
      pilihanPeranan(u.peranan) + '</select>' +
      (adalahAdminPenuh() ? '' : '<span class="bantu">Hanya Admin Penuh boleh melantik Admin.</span>') + '</div>' +
      '<div class="medan"><label>Entiti</label><select name="entiti_id">' + pilihanEntiti(u.entiti_id, { kosong: '— Tiada (kawasan) —' }) + '</select></div></div>' +
    '<div class="medan"><label>Jawatan</label><input name="jawatan" value="' + esc(u.jawatan) + '"></div>' +
    (baru || lulus ? '' : '<div class="medan"><label>Status</label><select name="status"' + (diri ? ' disabled' : '') + '>' + ['AKTIF', 'MENUNGGU', 'DRAF', 'NYAHAKTIF'].map(function (s) {
      return '<option' + (u.status === s ? ' selected' : '') + '>' + s + '</option>';
    }).join('') + '</select></div>') +
    (u.bendera ? '<div class="medan"><label>Bendera / nota</label><textarea name="bendera" rows="2">' + esc(u.bendera) + '</textarea></div>' : ''),
    [{ label: 'Batal', kelas: 'garis' }, { label: baru ? 'Tambah' : lulus ? 'Luluskan' : 'Simpan', kelas: lulus ? 'oren' : '', tindakan: function (d) {
      var data = nilaiBorang(d);
      if (diri) { delete data.peranan; delete data.status; }
      var janji = baru ? apiT('apiTambahPengguna', data)
        : lulus ? apiT('apiKemasPengguna', u.id, data).then(function () { return apiT('apiLuluskanPengguna', u.id, { peranan: data.peranan, entiti_id: data.entiti_id, jawatan: data.jawatan }); })
        : apiT('apiKemasPengguna', u.id, data);
      return janji.then(function () { toast(lulus ? 'Pengguna diluluskan.' : 'Disimpan.'); navigasi('admin', { tab: 'pengguna', status: statusKembali }); });
    } }]);
}

// ---------- UKJ & Lajnah (entiti) ----------
function adminEntiti(isi) {
  isi.innerHTML = '<div class="kad" style="max-width:720px"><h3>UKJ &amp; Lajnah / Jabatan<span class="ruang"></span><button class="butang kecil garis" id="e-tambah">+ Entiti</button></h3>' +
    '<p class="kecil" style="color:var(--teks-2);margin-top:0">Semua UKJ dan Lajnah/Jabatan ialah entiti di bawah DPPG dengan peraturan KPI yang sama.</p><ul class="senarai">' +
    KEADAAN.entiti.map(function (e) {
      return '<li><div class="isi"><div class="tajuk">' + esc(e.kod) + ' <span class="tag">' + esc(e.jenis === 'UKJ' ? 'UKJ' : 'Lajnah/Jabatan') + '</span>' + (String(e.aktif).toUpperCase() === 'FALSE' ? ' <span class="tag">Tidak aktif</span>' : '') + '</div><div class="kecil">' + esc(e.nama) + '</div></div>' +
        '<button class="butang kecil garis" data-ue="' + esc(e.id) + '">Ubah</button></li>';
    }).join('') + '</ul></div>';
  $('#e-tambah').onclick = function () { borangEntiti(null); };
  $$('[data-ue]', isi).forEach(function (b) { b.onclick = function () { borangEntiti(entitiIkutId(b.dataset.ue)); }; });
}

function gantiEntiti(e) {
  var i = KEADAAN.entiti.map(function (x) { return x.id; }).indexOf(e.id);
  if (i >= 0) KEADAAN.entiti[i] = e; else KEADAAN.entiti.push(e);
}

function borangEntiti(e) {
  var baru = !e;
  e = e || { jenis: 'LAJNAH', aktif: 'TRUE' };
  modal(baru ? 'Tambah entiti' : 'Ubah entiti',
    '<div class="baris-medan"><div class="medan"><label>Jenis</label><select name="jenis"' + (baru ? '' : ' disabled') + '><option' + (e.jenis === 'LAJNAH' ? ' selected' : '') + '>LAJNAH</option><option' + (e.jenis === 'UKJ' ? ' selected' : '') + '>UKJ</option></select></div>' +
    '<div class="medan"><label>Kod</label><input name="kod" value="' + esc(e.kod) + '"></div></div>' +
    '<div class="medan"><label>Nama penuh</label><input name="nama" value="' + esc(e.nama) + '"></div>' +
    '<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="aktif"' + (String(e.aktif).toUpperCase() !== 'FALSE' ? ' checked' : '') + '> Aktif</label>',
    [{ label: 'Batal', kelas: 'garis' }, { label: 'Simpan', tindakan: function (d) {
      var data = nilaiBorang(d);
      if (!baru) { data.id = e.id; delete data.jenis; }
      return apiT('apiSimpanEntiti', data).then(function (x) { gantiEntiti(x); toast('Entiti disimpan.'); navigasi('admin', { tab: 'entiti' }); });
    } }]);
}

// ---------- Ciri pengguna (Admin Penuh) ----------
var CIRI_SENARAI = [
  { kunci: 'KEDUDUKAN', nama: 'Kedudukan UKJ / Lajnah', bantu: 'Senarai ranking di dashboard. Ditutup jika "Dashboard entiti lain" ditutup.' },
  { kunci: 'ENTITI_LAIN', nama: 'Dashboard entiti lain', bantu: 'Jika ditutup, dashboard dikunci kepada entiti pengguna sendiri.' },
  { kunci: 'CETAK', nama: 'Cetak Laporan Bulanan', bantu: 'Memerlukan Kedudukan dan Dashboard entiti lain dibuka.' },
  { kunci: 'SEMUA_ENTITI', nama: 'Pelan & Tertunggak semua entiti', bantu: 'Jika ditutup, skrin Pelan dan Tertunggak hanya tunjuk entiti sendiri.' },
];

function adminCiri(isi) {
  var t = KEADAAN.ciriTetapan || {};
  var kotak = function (k, r) {
    var n = 'CIRI_' + k + '_' + r;
    return '<td style="text-align:center"><input type="checkbox" name="' + n + '"' + (t[n] === 'FALSE' ? '' : ' checked') + ' aria-label="' + n + '" style="width:18px;height:18px"></td>';
  };
  isi.innerHTML = '<div class="kad" style="max-width:720px"><form id="f-ciri">' +
    '<p class="kecil" style="color:var(--teks-2);margin-top:0">Tandakan ciri yang boleh dilihat. Admin sentiasa nampak semua. Perubahan berkuat kuasa bila pengguna membuka semula sistem.</p>' +
    '<div class="jadual-bungkus"><table class="jadual"><thead><tr><th>Ciri</th><th style="text-align:center">Ketua</th><th style="text-align:center">PIC</th></tr></thead><tbody>' +
    CIRI_SENARAI.map(function (c) {
      return '<tr><td><b>' + esc(c.nama) + '</b><div class="kecil" style="color:var(--teks-2)">' + esc(c.bantu) + '</div></td>' + kotak(c.kunci, 'KETUA') + kotak(c.kunci, 'PIC') + '</tr>';
    }).join('') + '</tbody></table></div>' +
    '<button class="butang" type="submit" style="margin-top:14px">Simpan ciri</button></form></div>';
  $('#f-ciri').onsubmit = function (ev) {
    ev.preventDefault();
    var b = $('button', ev.target);
    var data = {};
    $$('#f-ciri input[type=checkbox]').forEach(function (c) { data[c.name] = c.checked; });
    b.disabled = true;
    apiT('apiSimpanCiri', data).then(function (baru) { KEADAAN.ciriTetapan = baru; toast('Ciri pengguna disimpan.'); })
      .catch(function (e) { toast(e.message, 'ralat'); })
      .then(function () { b.disabled = false; });
  };
}

// ---------- Tetapan ----------
function adminTetapan(isi) {
  var t = KEADAAN.tetapan;
  var pc = function (v) { return Math.round(Number(v) * 100); };
  return apiT('apiSenaraiPengguna').then(function (pengguna) {
    var penyemak = String(t.PENYEMAK_LAPORAN || '').split(',');
    var calon = pengguna.filter(function (u) { return u.status === 'AKTIF' || penyemak.indexOf(u.id) >= 0; })
      .sort(function (a, b) { return (penyemak.indexOf(b.id) >= 0) - (penyemak.indexOf(a.id) >= 0) || String(a.nama).localeCompare(String(b.nama)); });
    isi.innerHTML = '<div class="kad" style="max-width:640px"><form id="f-tetapan">' +
      '<h3>Tempoh kiraan</h3><div class="baris-medan">' +
        '<div class="medan"><label>Tarikh mula sistem</label><input type="date" name="TARIKH_MULA_PELAN" value="' + esc(t.TARIKH_MULA_PELAN) + '">' +
          '<span class="bantu">Kiraan Kumulatif bermula di sini. Item tanpa tarikh mula ikut tarikh ini. Boleh ditukar bila-bila masa.</span></div>' +
        '<div class="medan"><label>Tarikh tamat (bila Parlimen dibubar)</label><input type="date" name="TARIKH_TAMAT" value="' + esc(t.TARIKH_TAMAT) + '"><span class="bantu">Biar kosong jika belum diketahui.</span></div></div>' +
      '<h3>Pemberat Skor KPI (%)</h3><div class="baris-medan">' +
        '<div class="medan"><label>Pelaksanaan</label><input type="number" min="0" max="100" name="P" value="' + pc(t.BERAT_PELAKSANAAN) + '"></div>' +
        '<div class="medan"><label>Keterlibatan</label><input type="number" min="0" max="100" name="K" value="' + pc(t.BERAT_KETERLIBATAN) + '"></div></div>' +
      '<div class="bantu" id="jumlah-berat" style="margin:-6px 0 14px"></div>' +
      '<h3>Ambang warna</h3><div class="baris-medan">' +
        '<div class="medan"><label>🟢 Hijau dari (%)</label><input type="number" name="AMBANG_HIJAU" value="' + esc(t.AMBANG_HIJAU) + '"></div>' +
        '<div class="medan"><label>🟡 Kuning dari (%)</label><input type="number" name="AMBANG_KUNING" value="' + esc(t.AMBANG_KUNING) + '"></div></div>' +
      '<h3>Penyemak laporan</h3>' +
      '<p class="kecil" style="color:var(--teks-2);margin-top:0">Lalai: Setiausaha dan PSU I. Seorang lulus sudah cukup. Penyemak tidak boleh meluluskan laporan sendiri. Admin Penuh sentiasa boleh meluluskan semua laporan.</p>' +
      '<div id="t-penyemak" style="max-height:220px;overflow:auto;border:1.5px solid var(--garis);border-radius:8px;padding:6px 10px;margin-bottom:14px">' +
        calon.map(function (u) {
          return '<label style="display:flex;gap:8px;align-items:center;padding:4px 0"><input type="checkbox" data-penyemak="' + esc(u.id) + '"' + (penyemak.indexOf(u.id) >= 0 ? ' checked' : '') + '> ' +
            esc(u.nama) + ' <span class="kecil" style="color:var(--teks-2)">· ' + esc(u.jawatan || labelPeranan(u.peranan)) + '</span></label>';
        }).join('') + '</div>' +
      '<h3>Copywriting media sosial</h3>' +
      '<div class="medan"><label>Hashtag lalai</label><input name="HASHTAG_MEDSOS" value="' + esc(t.HASHTAG_MEDSOS) + '" placeholder="#PemudaGombak"><span class="bantu">Ditambah di hujung setiap kapsyen.</span></div>' +
      '<button class="butang" type="submit">Simpan tetapan</button></form></div>';
    var semak = function () {
      var f = nilaiBorang($('#f-tetapan'));
      var j = Number(f.P) + Number(f.K);
      $('#jumlah-berat').innerHTML = 'Jumlah: <b style="color:' + (j === 100 ? 'var(--hijau)' : 'var(--merah)') + '">' + j + '%</b>' + (j === 100 ? '' : ' — mesti 100%');
      return j === 100;
    };
    $$('#f-tetapan input[name=P], #f-tetapan input[name=K]').forEach(function (i) { i.oninput = semak; });
    semak();
    $('#f-tetapan').onsubmit = function (ev) {
      ev.preventDefault();
      if (!semak()) { toast('Jumlah pemberat mesti 100%.', 'ralat'); return; }
      var f = nilaiBorang(ev.target);
      var b = $('button', ev.target);
      b.disabled = true;
      apiT('apiSimpanTetapan', {
        TARIKH_MULA_PELAN: f.TARIKH_MULA_PELAN, TARIKH_TAMAT: f.TARIKH_TAMAT,
        BERAT_PELAKSANAAN: Number(f.P) / 100, BERAT_KETERLIBATAN: Number(f.K) / 100,
        AMBANG_HIJAU: f.AMBANG_HIJAU, AMBANG_KUNING: f.AMBANG_KUNING, HASHTAG_MEDSOS: f.HASHTAG_MEDSOS,
        PENYEMAK_LAPORAN: $$('[data-penyemak]', ev.target).filter(function (c) { return c.checked; }).map(function (c) { return c.dataset.penyemak; }).join(','),
      }).then(function (baru) { KEADAAN.tetapan = baru; toast('Tetapan disimpan.'); })
        .catch(function (e) { toast(e.message, 'ralat'); })
        .then(function () { b.disabled = false; });
    };
  });
}
</script>

  <script>
// ===================== Cetak Laporan =====================
PAPARAN.cetak = {
  tajuk: 'Cetak Laporan',
  render: function (el, param) {
    if (!bolehCiri('cetakEntiti')) { el.innerHTML = '<div class="kad kosong">Cetak Laporan telah ditutup oleh Admin.</div>'; return; }
    var penuh = bolehCiri('cetak');
    var sendiri = KEADAAN.pengguna.entiti_id || '';
    var bebas = bolehCiri('entitiLain');
    var entiti = param.entiti !== undefined ? param.entiti : (penuh ? '' : sendiri);
    if (!bebas) entiti = sendiri;
    if (!entiti && !penuh) { el.innerHTML = '<div class="kad kosong">Akaun anda belum ada UKJ/Lajnah. Hubungi Admin.</div>'; return; }
    var bulan = param.bulan || KEADAAN.hariIni.slice(0, 7);
    if (bulan === 'JULAT' && !adalahAdminPenuh()) bulan = 'KUMULATIF';
    var julat = { dari: param.dari || KEADAAN.tetapan.TARIKH_MULA_PELAN, hingga: param.hingga || KEADAAN.hariIni };
    var pilihan = bebas ? pilihanEntiti(entiti, penuh ? { kosong: 'Semua UKJ & Lajnah (laporan penuh)' } : {})
      : '<option value="' + esc(sendiri) + '">' + esc(kodEntiti(sendiri) + ' — ' + namaEntiti(sendiri)) + '</option>';
    el.innerHTML = '<div class="penapis tiada-cetak"><select id="c-bulan"><option value="KUMULATIF">Kumulatif</option>' +
      (adalahAdminPenuh() ? '<option value="JULAT">Julat tarikh pilihan…</option>' : '') +
      senaraiBulan().map(function (ym) { return '<option value="' + ym + '">' + bulanPaparan(ym) + '</option>'; }).join('') + '</select>' +
      (bulan === 'JULAT' ? '<input type="date" id="c-dari" value="' + esc(julat.dari) + '" max="' + KEADAAN.hariIni + '" aria-label="Dari">' +
        '<input type="date" id="c-hingga" value="' + esc(julat.hingga) + '" max="' + KEADAAN.hariIni + '" aria-label="Hingga">' : '') +
      '<select id="c-entiti" aria-label="UKJ atau Lajnah"' + (bebas ? '' : ' disabled') + '>' + pilihan + '</select>' +
      '<button class="butang oren" id="c-cetak">Cetak / Simpan PDF</button></div><div id="c-isi"></div>';
    $('#c-bulan').value = bulan;
    $('#c-entiti').value = entiti;
    var semula = function () {
      navigasi('cetak', { bulan: $('#c-bulan').value, entiti: $('#c-entiti').value,
        dari: $('#c-dari') ? $('#c-dari').value : '', hingga: $('#c-hingga') ? $('#c-hingga').value : '' });
    };
    $$('#c-bulan, #c-entiti, #c-dari, #c-hingga').forEach(function (x) { x.onchange = semula; });
    $('#c-cetak').onclick = function () { window.print(); };
    var isi = $('#c-isi');
    memuat(isi);
    return apiT('apiCetak', bulan, entiti, bulan === 'JULAT' ? julat : null).then(function (d) {
      isi.innerHTML = entiti ? htmlCetakEntiti(d) : htmlCetak(d);
    });
  },
};

function barisCetak(r, nama) {
  return '<tr><td>' + esc(nama) + '</td><td>' + fmtPeratus(r.pelaksanaan) + '</td><td>' + fmtPeratus(r.keterlibatan) + '</td>' +
    '<td><b>' + fmtPeratus(r.skor) + '</b> ' + lencanaWarna(r.warna, '') + '</td></tr>';
}

function kepalaCetak(d, tajuk) {
  return '<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px">' +
      '<div class="cetak-jenama"><img class="logo-cetak" src="' + LOGO_DPPG + '" alt="Logo Dewan Pemuda PAS Kawasan Gombak">' +
      '<div><div style="font-size:11px;font-weight:700;color:var(--oren);letter-spacing:.08em">DEWAN PEMUDA PAS KAWASAN GOMBAK</div><h1>' + tajuk + '</h1>' +
      '<div style="color:var(--teks-2)">' + esc(d.labelTempoh || '') + '</div></div></div>' +
      '<div style="font-size:11px;color:var(--teks-2);text-align:right">Dijana ' + esc(d.dijana) + '</div></div>';
}

function angkaCetak(k) {
  return '<div class="cetak-angka">' +
      '<div><span>Skor KPI</span><b>' + fmtPeratus(k.skor) + '</b></div>' +
      '<div><span>% Pelaksanaan</span><b>' + fmtPeratus(k.pelaksanaan) + '</b></div>' +
      '<div><span>% Keterlibatan</span><b>' + fmtPeratus(k.keterlibatan) + '</b></div>' +
      '<div><span>Sesi dilaksana</span><b>' + (k.bilSesi || 0) + '</b>' + (k.bilMenunggu ? '<span>' + k.bilMenunggu + ' menunggu semakan</span>' : '') + '</div>' +
    '</div>';
}

function notaCetak() {
  return '<p style="font-size:10px;color:var(--teks-2);margin-top:18px">Skor KPI = ' + Math.round(KEADAAN.tetapan.BERAT_PELAKSANAAN * 100) + '% pelaksanaan + ' +
      Math.round(KEADAAN.tetapan.BERAT_KETERLIBATAN * 100) + '% keterlibatan. Hanya laporan yang telah diluluskan dikira. ' +
      'Pelaksanaan dikira pro-rata sehingga tarikh laporan.</p>';
}

// Laporan satu UKJ / Lajnah: ringkasan, setiap program dengan capaian, sesi dilaksana, tertunggak.
function htmlCetakEntiti(d) {
  var e = d.entiti;
  var capai = function (p) {
    if (p.peratus === null || p.peratus === undefined) return '<span style="color:var(--teks-2)">Belum dikira</span>';
    return fmtPeratus(p.peratus) + ' ' + lencanaWarna(p.warna, '');
  };
  var dilaksana = function (p) { return p.sepatutnya ? (Math.round(p.dilaksana * 10) / 10) + ' / ' + (Math.round(p.sepatutnya * 10) / 10) : String(p.dilaksana); };
  return '<div class="cetak-halaman">' +
    kepalaCetak(d, 'Laporan KPI ' + esc(e.nama)) +
    angkaCetak(d.kad) +
    '<h2>Program (' + d.program.length + ')</h2>' +
    (d.program.length ? '<table class="jadual"><thead><tr><th>Program</th><th>Target</th><th>Dilaksana</th><th>Capaian</th></tr></thead><tbody>' +
      d.program.map(function (p) {
        return '<tr><td>' + esc(p.nama_program) + (p.pemilik ? '' : '<div class="kecil" style="color:var(--teks-2)">Program kongsi · pemilik: ' + esc(kodEntiti(p.entiti_id)) + '</div>') + '</td>' +
          '<td>' + esc(labelJenis(p)) + '</td><td>' + dilaksana(p) + '</td><td style="white-space:nowrap">' + capai(p) + '</td></tr>';
      }).join('') + '</tbody></table>' : '<p>Tiada program.</p>') +
    '<h2>Sesi dilaksana (' + d.sesi.length + ')</h2>' +
    (d.sesi.length ? '<table class="jadual"><thead><tr><th>Tarikh</th><th>Program</th><th>Lokasi</th><th>Hadir</th><th>Dilapor oleh</th></tr></thead><tbody>' +
      d.sesi.map(function (s) {
        return '<tr><td style="white-space:nowrap">' + tarikhPaparan(s.tarikh) + '</td><td>' + esc(s.nama) + '</td>' +
          '<td>' + esc(s.lokasi || '—') + '</td><td>' + esc(s.jumlah_hadir === '' ? '—' : s.jumlah_hadir) + '</td><td>' + esc(s.penghantar_nama || '—') + '</td></tr>';
      }).join('') + '</tbody></table>' : '<p>Tiada sesi diluluskan dalam tempoh ini.</p>') +
    '<h2>Program tertunggak (' + d.tertunggak.length + ')</h2>' +
    (d.tertunggak.length ? '<table class="jadual"><thead><tr><th>Program</th><th>Status</th><th>Capaian</th></tr></thead><tbody>' +
      d.tertunggak.map(function (t) { return '<tr><td>' + esc(t.nama_program) + '</td><td>' + esc(t.sebab) + '</td><td>' + fmtPeratus(t.peratus) + '</td></tr>'; }).join('') +
      '</tbody></table>' : '<p>Tiada.</p>') +
    notaCetak() +
  '</div>';
}

function htmlCetak(d) {
  var kepala = '<thead><tr><th>Entiti</th><th>Pelaksanaan</th><th>Keterlibatan</th><th>Skor KPI</th></tr></thead>';
  return '<div class="cetak-halaman">' +
    kepalaCetak(d, 'Laporan KPI UKJ &amp; Lajnah') +
    angkaCetak(d.kad) +
    '<h2>UKJ</h2><table class="jadual">' + kepala + '<tbody>' + d.kedudukan.ukj.map(function (r) { return barisCetak(r, r.nama); }).join('') + '</tbody></table>' +
    '<h2>Lajnah / Jabatan</h2><table class="jadual">' + kepala + '<tbody>' + d.kedudukan.lajnah.map(function (r) { return barisCetak(r, r.nama); }).join('') + '</tbody></table>' +
    '<h2>Program tertunggak (' + d.tertunggak.length + ')</h2>' +
    (d.tertunggak.length ? '<table class="jadual"><thead><tr><th>Program</th><th>Entiti</th><th>Status</th><th>Capaian</th></tr></thead><tbody>' +
      d.tertunggak.map(function (t) { return '<tr><td>' + esc(t.nama_program) + '</td><td>' + esc(kodEntiti(t.entiti_id)) + '</td><td>' + esc(t.sebab) + '</td><td>' + fmtPeratus(t.peratus) + '</td></tr>'; }).join('') +
      '</tbody></table>' : '<p>Tiada.</p>') +
    notaCetak() +
  '</div>';
}
</script>

  <script>mula();</script>
</body>
</html>
